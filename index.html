<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sunny Storytime Chapter 1 - Brothers Playtime</title>
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background: #000; 
            width: 100%; height: 100%; font-family: monospace; 
        }
        #hud { 
            position: absolute; top: 15px; left: 15px; color: #ff3333; 
            font-size: 14px; z-index: 10; text-shadow: 0 0 5px #000; pointer-events: none; 
        }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: rgba(255, 255, 255, 0.5); font-size: 20px; z-index: 10; pointer-events: none; 
        }
        
        /* Unbreakable Main Title Overlay Screen */
        #instructions { 
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            background: #0a0a10; color: #fff; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; z-index: 99999; 
        }
        #start-button { 
            padding: 22px 65px; font-size: 24px; font-family: monospace; font-weight: bold;
            background: #ffd700; color: #000; border: 3px solid #fff; border-radius: 10px; 
            cursor: pointer; box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }
        #joystick-container { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: none; z-index: 15; touch-action: none; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #ffd700; border-radius: 50%; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="instructions">
        <h1 style="color: #ffd700; font-size: 38px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,215,0,0.3);">SUNNY STORYTIME</h1>
        <p style="color: #ff3333; font-size: 16px; margin-top: 0; margin-bottom: 40px; font-weight: bold; letter-spacing: 2px;">BY BROTHERS PLAYTIME</p>
        
        <button id="start-button" onclick="launchGameEngine()">START GAME</button>
        
        <p style="font-size: 12px; color: #666; margin-top: 40px; line-height: 1.6;">
            PC: WASD + Mouse Look (Click floor to lock mouse)<br>
            Mobile: Left Joystick + Swipe Screen to Look
        </p>
    </div>

    <div id="hud">BROTHERS PLAYTIME | OBJECTIVE: FIND THE RED AND BLUE HANDS (RBHP)</div>
    <div id="crosshair">+</div>
    <div id="joystick-container"><div id="joystick-knob"></div></div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.12);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Core Environment Architecture
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 100), new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        const wallL = new THREE.Mesh(new THREE.PlaneGeometry(100, 12), new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.9 }));
        wallL.position.set(-10, 6, 0); wallL.rotation.y = Math.PI / 2; scene.add(wallL);
        const wallR = wallL.clone(); wallR.position.set(10, 6, 0); wallR.rotation.y = -Math.PI / 2; scene.add(wallR);

        // Entities & Interactive Asset Bundles
        let hasBlue = false, hasRed = false, isChasing = false, running = false;
        const blueH = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2), new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x002288 }));
        blueH.position.set(-4, 1.5, -10); scene.add(blueH);
        const redH = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.2), new THREE.MeshStandardMaterial({ color: 0xff1133, emissive: 0x880011 }));
        redH.position.set(4, 1.5, -20); scene.add(redH);
        const sunny = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
        sunny.position.set(0, 3, -40); scene.add(sunny);

        // Illumination Mapping
        scene.add(new THREE.AmbientLight(0x050510));
        const flashlight = new THREE.SpotLight(0xffffff, 4, 35, Math.PI / 5, 0.5, 1);
        flashlight.position.set(0, 2, 0); scene.add(flashlight); scene.add(flashlight.target);
        camera.position.set(0, 2, 25);

        let moveF = false, moveB = false, moveL = false, moveR = false;
        let mobileF = 0, mobileR = 0, yaw = 0, pitch = 0;
        const speed = 0.12, sunnySpeed = 0.09;
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

        // Core Activation System - Erases the blocking screen entirely to fix freezing
        function launchGameEngine() {
            running = true;
            const menuScreen = document.getElementById('instructions');
            if(menuScreen) menuScreen.remove(); 
            
            if (isMobile) {
                document.getElementById('joystick-container').style.display = 'block';
            } else {
                document.body.requestPointerLock();
            }
        }

        // Pointer Lock fires on canvas interactions naturally after screen removal
        document.body.addEventListener('click', () => {
            if (running && !isMobile && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        // Camera Logic
        document.addEventListener('mousemove', (e) => {
            if (!running || isMobile || document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        // Mobile Swiping Look
        let lx = 0, ly = 0;
        document.addEventListener('touchstart', (e) => { if(!e.target.closest('#joystick-container')) { lx = e.touches.clientX; ly = e.touches.clientY; }}, {passive: true});
        document.addEventListener('touchmove', (e) => {
            if(!running || e.target.closest('#joystick-container')) return;
            yaw -= (e.touches.clientX - lx) * 0.005; pitch -= (e.touches.clientY - ly) * 0.005;
            pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            lx = e.touches.clientX; ly = e.touches.clientY;
        }, {passive: true});

        // Mobile Joystick Controls Matrix
        const knob = document.getElementById('joystick-knob');
        let jActive = false;
        document.getElementById('joystick-container').addEventListener('touchstart', () => jActive = true, {passive: true});
        window.addEventListener('touchmove', (e) => {
            if (!running || !jActive) return;
            const t = Array.from(e.touches).find(touch => touch.target.closest('#joystick-container'));
            if (!t) return;
            const r = document.getElementById('joystick-container').getBoundingClientRect();
            let dx = t.clientX - (r.left + 50), dy = t.clientY - (r.top + 50);
            const dist = Math.min(40, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            mobileR = (Math.cos(angle)*dist) / 40; mobileF = -(Math.sin(angle)*dist) / 40;
        }, {passive: true});
        window.addEventListener('touchend', () => { jActive = false; knob.style.transform = 'translate(0px, 0px)'; mobileF = 0; mobileR = 0; });

        // Keyboard System Configuration (Fixed typo here)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'a' || e.key === 's' || e.key === 'd' || e.key.startsWith('Arrow')) e.preventDefault();
            if (e.key === 'w' || e.key === 'ArrowUp') moveF = true;
            if (e.key === 's' || e.key === 'ArrowDown') moveB = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveL = true;
            if (e.key === 'd' || e.key === 'ArrowRight') moveR = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveF = false;
            if (e.key === 's' || e.key === 'ArrowDown') moveB = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveL = false;
            if (e.key === 'd' || e.key === 'ArrowRight') moveR = false;
        });

        // Main Rendering/Logic System Loop
        function animate() {
            requestAnimationFrame(animate);
            if (running) {
                const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); f.y = 0; f.normalize();
                const r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); r.y = 0; r.normalize();

                if (moveF) camera.position.addScaledVector(f, speed);
                if (moveB) camera.position.addScaledVector(f, -speed);
                if (moveL) camera.position.addScaledVector(r, -speed);
                if (moveR) camera.position.addScaledVector(r, speed); // Fixed tracking typo
                if (isMobile) { camera.position.addScaledVector(f, mobileF * speed); camera.position.addScaledVector(r, mobileR * speed); }

                camera.position.x = Math.max(-9, Math.min(9, camera.position.x));
                camera.position.z = Math.max(-45, Math.min(45, camera.position.z));
flashlight.position.copy(camera.position);
flashlight.target.position.copy(new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position));
// Loot Detection Checks
if (!hasBlue && camera.position.distanceTo(blueH.position) < 2) { hasBlue = true; scene.remove(blueH); document.getElementById('hud').innerText = hasRed ? "RUN TO THE START ENTRANCE!" : "FOUND BLUE HAND. FIND RED!"; }
if (!hasRed && camera.position.distanceTo(redH.position) < 2) { hasRed = true; scene.remove(redH); document.getElementById('hud').innerText = hasBlue ? "RUN TO THE START ENTRANCE!" : "FOUND RED HAND. FIND BLUE!"; }
// The Climax Chase Engine
if (hasBlue && hasRed) {
if (!isChasing) { isChasing = true; flashlight.color.setHex(0xff0000); }
const dir = new THREE.Vector3().subVectors(camera.position, sunny.position); dir.y = 0; dir.normalize();
sunny.position.addScaledVector(dir, sunnySpeed);
sunny.position.y = 3 + Math.sin(Date.now() * 0.02) * 0.4;
if (camera.position.distanceTo(sunny.position) < 2.2) { document.getElementById('hud').innerText = "SUNNY CAUGHT YOU! REFRESH TO RESTART."; running = false; }
else if (camera.position.z > 22) { document.getElementById('hud').innerText = "YOU ESCAPED CHAPTER 1! VICTORIOUS."; running = false; }
} else { sunny.position.y = 3 + Math.sin(Date.now() * 0.003) * 0.1; }
}
renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer
